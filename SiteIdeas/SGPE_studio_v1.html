<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPE Studio</title>
    <style>
        /* Reseta margens e barras de rolagem do navegador */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Impede que a página principal crie barras de rolagem */
            background-color: #000; /* Cor de fundo caso demore para carregar */
        }

        /* Configura o iframe para ocupar a tela inteira sem bordas */
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://sgpe-studio.ai.studio" allowfullscreen></iframe>

</body>
</html>
