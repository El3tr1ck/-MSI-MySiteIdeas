<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Sorteador</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 2rem;
      color: #f59e0b;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.2);
    }

    header p {
      color: #64748b;
      font-size: 0.9rem;
    }

    /* Layout Principal: Globo à esquerda, Bandeja à direita */
    .app-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      justify-content: center;
      align-items: flex-start;
    }

    /* Painel Esquerdo: Globo 3D e Controles */
    .panel-left {
      width: 320px;
      background: rgba(17, 24, 39, 0.85);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Globo 3D isolado em seu próprio canvas */
    .globe-3d-wrapper {
      width: 100%;
      height: 260px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Display do Sorteio */
    .display-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 110px;
    }

    .ball-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .current-ball {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #cbd5e1 50%, #475569 100%);
      box-shadow: 0 8px 16px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #0f172a;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: scale(0);
    }

    .current-ball.show {
      transform: scale(1);
    }

    .current-ball .letter {
      font-size: 1rem;
      line-height: 1;
      margin-bottom: -2px;
      opacity: 0.8;
    }

    .current-ball .number {
      font-size: 2.2rem;
      line-height: 1;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .stat-item span {
      font-weight: bold;
      color: #f59e0b;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    button {
      padding: 10px 15px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-draw {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-draw:hover {
      filter: brightness(1.1);
    }

    .btn-draw:disabled {
      background: #475569;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .voice-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .history-container {
      width: 100%;
      text-align: center;
    }

    .history-container h3 {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .history-list {
      display: flex;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
    }

    .history-ball {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.25);
    }

    /* Painel Direito: Bandeira 2D Completa Vista de Cima */
    .panel-right {
      flex: 1;
      background: rgba(17, 24, 39, 0.8);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .board-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: #f1f5f9;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    /* Estrutura 2D da Bandeja */
    .tray-2d {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #111827;
      padding: 15px;
      border-radius: 12px;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6);
    }

    .tray-row {
      display: flex;
      align-items: center;
    }

    /* Letras B-I-N-G-O da bandeja */
    .tray-letter {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
      margin-right: 15px;
      flex-shrink: 0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .row-b .tray-letter { background: #dc2626; color: white; }
    .row-i .tray-letter { background: #ea580c; color: white; }
    .row-n .tray-letter { background: #2563eb; color: white; }
    .row-g .tray-letter { background: #9333ea; color: white; }
    .row-o .tray-letter { background: #16a34a; color: white; }

    /* Compartimentos de encaixe da bandeja */
    .tray-slots {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 6px;
      width: 100%;
    }

    /* Cavidade vazia da bandeja */
    .slot-cell {
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bolinha física repousada na bandeja 2D */
    .slot-ball {
      width: 90%;
      height: 90%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #cbd5e1 60%, #475569 100%);
      color: #0f172a;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #000000; /* Outline padrão */
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transform: scale(0);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .slot-ball.show {
      transform: scale(1);
    }

    /* Brilho Verde ao Pousar (2 segundos) */
    .slot-ball.glow-landing {
      animation: greenGlow 2s ease-out;
    }

    @keyframes greenGlow {
      0% {
        border-color: #10b981;
        box-shadow: 0 0 15px #10b981, inset 0 0 10px #10b981;
      }
      100% {
        border-color: #000000;
        box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      }
    }

    /* Brilho Dourado persistente ao Clicar */
    .slot-ball.glow-clicked {
      border-color: #f59e0b !important;
      box-shadow: 0 0 15px #f59e0b, inset 0 0 10px #f59e0b !important;
    }

    @media (max-width: 950px) {
      .app-container {
        flex-direction: column;
        align-items: center;
      }
      .panel-left, .panel-right {
        width: 100%;
        max-width: 600px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Bingo Sorteador</h1>
    <p>Globo Físico 3D & Bandeja 2D Vista de Cima</p>
  </header>

  <div class="app-container">
    
    <!-- Painel de Sorteio (Esquerdo) -->
    <div class="panel-left">
      <!-- Sorteador 3D Isolado -->
      <div class="globe-3d-wrapper" id="canvas-container"></div>

      <!-- Display da Bola Atual -->
      <div class="display-area">
        <div class="ball-label" id="ballLabelTitle">Aguardando sorteio...</div>
        <div class="current-ball" id="currentBall">
          <span class="letter" id="displayLetter">-</span>
          <span class="number" id="displayNumber">-</span>
        </div>
      </div>

      <!-- Estatísticas -->
      <div class="stats-bar">
        <div class="stat-item">No Globo: <span id="statRemaining">75</span></div>
        <div class="stat-item">Sorteados: <span id="statDrawn">0</span>/75</div>
      </div>

      <!-- Controles -->
      <div class="controls">
        <button id="btnDraw" class="btn-draw" onclick="drawBall()">
          Sortear Número
        </button>
        <button class="btn-reset" onclick="resetBingo()">
          Reiniciar Jogo
        </button>
      </div>

      <div class="voice-control">
        <input type="checkbox" id="voiceToggle" checked style="cursor: pointer;">
        <span>Falar número sorteado</span>
      </div>

      <!-- Histórico Recente -->
      <div class="history-container">
        <h3>Últimos sorteados</h3>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <!-- Painel da Bandeja 2D (Direito) -->
    <div class="panel-right">
      <div class="board-header">Bandeja de Conferência (Geral)</div>
      <div class="tray-2d" id="tray2D"></div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const config = [
      { letter: 'B', min: 1, max: 15, class: 'row-b', color: 'radial-gradient(circle at 30% 30%, #ffffff 0%, #f87171 50%, #dc2626 100%)' },
      { letter: 'I', min: 16, max: 30, class: 'row-i', color: 'radial-gradient(circle at 30% 30%, #ffffff 0%, #fb923c 50%, #ea580c 100%)' },
      { letter: 'N', min: 31, max: 45, class: 'row-n', color: 'radial-gradient(circle at 30% 30%, #ffffff 0%, #60a5fa 50%, #2563eb 100%)' },
      { letter: 'G', min: 46, max: 60, class: 'row-g', color: 'radial-gradient(circle at 30% 30%, #ffffff 0%, #c084fc 50%, #9333ea 100%)' },
      { letter: 'O', min: 61, max: 75, class: 'row-o', color: 'radial-gradient(circle at 30% 30%, #ffffff 0%, #4ade80 50%, #16a34a 100%)' }
    ];

    let availablePool = Array.from({ length: 75 }, (_, i) => i + 1);
    let drawnList = [];
    let isSpinning = false;

    // Variáveis globais do motor Three.js (Apenas para o Globo 3D à esquerda)
    let scene, camera, renderer, globeGroup, cage;
    let balls3D = [];
    const sphereRadiusLimit = 1.62;
    const ballRadius = 0.12;
    const minCollisionDist = ballRadius * 2;

    // Transição da bolinha que sai fisicamente do globo
    let activeRemovalTransition = null;

    window.addEventListener('DOMContentLoaded', () => {
      buildTray2D();
      init3D();
      animate3D();
    });

    // Constrói a Bandeja 2D em formato de furos circulares
    function buildTray2D() {
      const tray = document.getElementById('tray2D');
      tray.innerHTML = '';

      config.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = `tray-row ${row.class}`;

        const letterBadge = document.createElement('div');
        letterBadge.className = 'tray-letter';
        letterBadge.innerText = row.letter;
        rowDiv.appendChild(letterBadge);

        const slotsContainer = document.createElement('div');
        slotsContainer.className = 'tray-slots';

        for (let i = row.min; i <= row.max; i++) {
          const slotCell = document.createElement('div');
          slotCell.className = 'slot-cell';
          slotCell.id = `slot-${i}`;

          // Bolinha oculta inicialmente dentro de cada encaixe
          const slotBall = document.createElement('div');
          slotBall.className = 'slot-ball';
          slotBall.id = `ball-${i}`;
          slotBall.innerText = i;

          // Eventos para acionar o brilho dourado persistente e apagar no mouseout
          slotBall.addEventListener('mousedown', () => {
            slotBall.classList.add('glow-clicked');
          });
          slotBall.addEventListener('mouseleave', () => {
            slotBall.classList.remove('glow-clicked');
          });

          slotCell.appendChild(slotBall);
          slotsContainer.appendChild(slotCell);
        }

        rowDiv.appendChild(slotsContainer);
        tray.appendChild(rowDiv);
      });
    }

    // Configura o motor 3D focado exclusivamente no Globo
    function init3D() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 0, 5.0); // Foco centralizado e aproximado no globo

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Iluminação do globo aramado
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight1.position.set(5, 8, 5);
      scene.add(dirLight1);

      // Globo mecânico rotatório
      globeGroup = new THREE.Group();

      const cageGeom = new THREE.SphereGeometry(1.8, 16, 16);
      const cageMat = new THREE.MeshStandardMaterial({
        color: 0x94a3b8,
        wireframe: true,
        metalness: 0.9,
        roughness: 0.1
      });
      cage = new THREE.Mesh(cageGeom, cageMat);
      globeGroup.add(cage);

      const ringGeom = new THREE.TorusGeometry(1.8, 0.04, 8, 48);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8, roughness: 0.2 });
      
      const ring1 = new THREE.Mesh(ringGeom, ringMat);
      cage.add(ring1);

      const ring2 = new THREE.Mesh(ringGeom, ringMat);
      ring2.rotation.x = Math.PI / 2;
      cage.add(ring2);

      scene.add(globeGroup);

      // Pedestal e Eixo Estáticos
      const supportGroup = new THREE.Group();
      const legGeom = new THREE.CylinderGeometry(0.05, 0.05, 2.8, 8);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });

      const legL = new THREE.Mesh(legGeom, legMat);
      legL.position.set(-1.9, -1.0, 0);
      legL.rotation.z = 0.12;
      supportGroup.add(legL);

      const legR = new THREE.Mesh(legGeom, legMat);
      legR.position.set(1.9, -1.0, 0);
      legR.rotation.z = -0.12;
      supportGroup.add(legR);

      // Eixo de rotação horizontal
      const axleGeom = new THREE.CylinderGeometry(0.04, 0.04, 4.0, 12);
      axleGeom.rotateZ(Math.PI / 2);
      const axle = new THREE.Mesh(axleGeom, legMat);
      supportGroup.add(axle);

      const baseGeom = new THREE.BoxGeometry(4.4, 0.15, 2.2);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6, roughness: 0.4 });
      const base = new THREE.Mesh(baseGeom, baseMat);
      base.position.set(0, -2.35, 0);
      supportGroup.add(base);

      scene.add(supportGroup);

      // Inicializa 75 bolinhas 3D flutuando no fundo
      createBalls();

      window.addEventListener('resize', onWindowResize);
    }

    function createBalls() {
      balls3D.forEach(b => scene.remove(b));
      balls3D = [];

      const ballGeom = new THREE.SphereGeometry(ballRadius, 14, 14);
      const ballMat = new THREE.MeshStandardMaterial({
        color: 0xfafafa, // Bolinhas brancas no interior
        roughness: 0.3,
        metalness: 0.05
      });
      const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });

      for (let i = 1; i <= 75; i++) {
        const ballMesh = new THREE.Mesh(ballGeom, ballMat);

        // Contorno preto 3D
        const outlineMesh = new THREE.Mesh(ballGeom, outlineMat);
        outlineMesh.scale.set(1.15, 1.15, 1.15);
        ballMesh.add(outlineMesh);

        // Amontoado físico inicial concentrado no fundo
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 0.7;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = -1.45 + (Math.random() * 0.5);

        ballMesh.position.set(x, y, z);

        ballMesh.userData = {
          number: i,
          velocity: new THREE.Vector3(0, 0, 0)
        };

        scene.add(ballMesh);
        balls3D.push(ballMesh);
      }
    }

    // Processamento de gravidade e colisão elástica
    function animate3D() {
      requestAnimationFrame(animate3D);

      if (isSpinning) {
        cage.rotation.x += 0.16; // Giro mecânico para frente
      } else {
        cage.rotation.x += 0.003;
      }

      // 1. Aplicação de gravidade ou agitação caótica
      balls3D.forEach(ball => {
        if (isSpinning) {
          ball.userData.velocity.x += (Math.random() - 0.5) * 0.38;
          ball.userData.velocity.y += (Math.random() - 0.5) * 0.38;
          ball.userData.velocity.z += (Math.random() - 0.5) * 0.38;
          ball.userData.velocity.clampLength(0, 0.35);
        } else {
          ball.userData.velocity.y -= 0.015;
          ball.userData.velocity.multiplyScalar(0.91);
        }

        ball.position.add(ball.userData.velocity);
      });

      // 2. Colisão Esfera-Esfera entre as bolinhas
      const passes = 2;
      for (let p = 0; p < passes; p++) {
        for (let i = 0; i < balls3D.length; i++) {
          const b1 = balls3D[i];
          for (let j = i + 1; j < balls3D.length; j++) {
            const b2 = balls3D[j];
            const dx = b2.position.x - b1.position.x;
            const dy = b2.position.y - b1.position.y;
            const dz = b2.position.z - b1.position.z;
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

            if (dist < minCollisionDist && dist > 0.01) {
              const overlap = minCollisionDist - dist;
              const nx = dx / dist;
              const ny = dy / dist;
              const nz = dz / dist;

              b1.position.x -= nx * overlap * 0.5;
              b1.position.y -= ny * overlap * 0.5;
              b1.position.z -= nz * overlap * 0.5;

              b2.position.x += nx * overlap * 0.5;
              b2.position.y += ny * overlap * 0.5;
              b2.position.z += nz * overlap * 0.5;

              const kx = b1.userData.velocity.x - b2.userData.velocity.x;
              const ky = b1.userData.velocity.y - b2.userData.velocity.y;
              const kz = b1.userData.velocity.z - b2.userData.velocity.z;
              const pValue = 2 * (nx * kx + ny * ky + nz * kz) / 2;

              b1.userData.velocity.x -= pValue * nx * 0.75;
              b1.userData.velocity.y -= pValue * ny * 0.75;
              b1.userData.velocity.z -= pValue * nz * 0.75;

              b2.userData.velocity.x += pValue * nx * 0.75;
              b2.userData.velocity.y += pValue * ny * 0.75;
              b2.userData.velocity.z += pValue * nz * 0.75;
            }
          }
        }

        // 3. Colisão de Limite da Esfera do Globo
        balls3D.forEach(ball => {
          const dist = ball.position.length();
          if (dist > sphereRadiusLimit) {
            ball.position.setLength(sphereRadiusLimit);
            
            const normal = ball.position.clone().normalize();
            ball.userData.velocity.reflect(normal);
            ball.userData.velocity.multiplyScalar(0.6);
          }
        });
      }

      // 4. Animação Física de Remoção (Bolinha sai pelo canal inferior e desaparece)
      if (activeRemovalTransition) {
        const t = activeRemovalTransition.progress;
        const ball = activeRemovalTransition.ball;

        ball.position.lerpVectors(activeRemovalTransition.startPos, activeRemovalTransition.endPos, t);
        // Diminui o tamanho progressivamente para dar efeito de descida no canal
        const scaleVal = THREE.MathUtils.lerp(1, 0.1, t);
        ball.scale.set(scaleVal, scaleVal, scaleVal);

        activeRemovalTransition.progress += 0.08;

        if (activeRemovalTransition.progress >= 1) {
          scene.remove(ball);
          
          // Agora, ativa a bolinha correspondente na bandeja 2D
          placeBallOnTray2D(ball.userData.number);
          activeRemovalTransition = null;
        }
      }

      renderer.render(scene, camera);
    }

    // Coloca a bolinha na bandeja 2D e aciona as luzes
    function placeBallOnTray2D(number) {
      const ball2D = document.getElementById(`ball-${number}`);
      if (ball2D) {
        ball2D.classList.add('show');
        
        // Aciona o brilho verde por 2 segundos na bandeja
        ball2D.classList.add('glow-landing');
        setTimeout(() => {
          ball2D.classList.remove('glow-landing');
        }, 2000);
      }
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    // Realiza o Sorteio
    function drawBall() {
      if (isSpinning || availablePool.length === 0 || activeRemovalTransition) return;

      isSpinning = true;
      document.getElementById('btnDraw').disabled = true;

      const currentBall = document.getElementById('currentBall');
      currentBall.classList.remove('show');
      document.getElementById('ballLabelTitle').innerText = 'Misturando...';

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * availablePool.length);
        const drawnNum = availablePool.splice(randomIndex, 1)[0];
        drawnList.push(drawnNum);

        const category = config.find(c => drawnNum >= c.min && drawnNum <= c.max);

        // Identifica e remove a bola fisicamente do globo 3D
        const drawnBall3D = balls3D.find(b => b.userData.number === drawnNum);
        if (drawnBall3D) {
          balls3D = balls3D.filter(b => b !== drawnBall3D);

          // Animação de saída pela rampa de escape inferior (x=0, y=-1.8, z=0.5)
          activeRemovalTransition = {
            ball: drawnBall3D,
            startPos: drawnBall3D.position.clone(),
            endPos: new THREE.Vector3(0, -1.8, 0.5),
            progress: 0
          };
        } else {
          // Caso a bola já tenha saído de alguma outra forma, posiciona na bandeja imediatamente
          placeBallOnTray2D(drawnNum);
        }

        isSpinning = false;
        showDrawnBall(category, drawnNum);
        updateStats();
        updateHistory();
        announceNumber(category.letter, drawnNum);

        if (availablePool.length > 0) {
          document.getElementById('btnDraw').disabled = false;
        } else {
          document.getElementById('ballLabelTitle').innerText = 'Fim de Jogo!';
        }
      }, 1800);
    }

    function showDrawnBall(category, num) {
      document.getElementById('ballLabelTitle').innerText = 'Sorteado!';
      
      const currentBall = document.getElementById('currentBall');
      const dLetter = document.getElementById('displayLetter');
      const dNum = document.getElementById('displayNumber');

      dLetter.innerText = category.letter;
      dNum.innerText = num;

      currentBall.style.background = category.color;
      currentBall.style.color = '#ffffff';

      currentBall.classList.add('show');
    }

    function updateStats() {
      // O contador diminui com as bolinhas sendo fisicamente removidas do interior
      document.getElementById('statRemaining').innerText = availablePool.length;
      document.getElementById('statDrawn').innerText = drawnList.length;
    }

    function updateHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';

      const lastFive = drawnList.slice(-5).reverse();

      lastFive.forEach(num => {
        const category = config.find(c => num >= c.min && num <= c.max);
        const histBall = document.createElement('div');
        histBall.className = 'history-ball';
        histBall.style.background = category.color;
        histBall.innerText = num;
        list.appendChild(histBall);
      });
    }

    function announceNumber(letter, num) {
      const toggle = document.getElementById('voiceToggle');
      if (toggle && toggle.checked && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = `Letra ${letter}. Número ${num}.`;
        msg.lang = 'pt-BR';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    function resetBingo() {
      if (drawnList.length > 0) {
        if (!confirm('Deseja realmente esvaziar a bandeja e recomeçar a rodada?')) {
          return;
        }
      }

      availablePool = Array.from({ length: 75 }, (_, i) => i + 1);
      drawnList = [];
      isSpinning = false;
      activeRemovalTransition = null;

      document.getElementById('currentBall').classList.remove('show');
      document.getElementById('ballLabelTitle').innerText = 'Aguardando sorteio...';
      document.getElementById('historyList').innerHTML = '';
      document.getElementById('btnDraw').disabled = false;
      updateStats();

      // Esconde todas as bolinhas da bandeja 2D
      document.querySelectorAll('.slot-ball').forEach(ball => {
        ball.className = 'slot-ball';
      });

      createBalls();
    }
  </script>
</body>
</html>
