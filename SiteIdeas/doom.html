<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - Clássico MS-DOS</title>
    
    <!-- CSS oficial do JS-DOS v8 -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    
    <style>
        /* Variáveis de estilo para consistência visual */
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1a1a1d;
            --primary-color: #e50914; /* Vermelho clássico do DOOM */
            --primary-hover: #b80710;
            --text-color: #c5c6c7;
            --title-color: #ffffff;
            --accent-color: #4e4e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 3.5rem;
            color: var(--title-color);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.6), 0 0 20px rgba(229, 9, 20, 0.4);
            font-weight: 900;
        }

        header p {
            font-size: 1.1rem;
            color: #95a5a6;
            letter-spacing: 1px;
        }

        /* Container principal */
        .game-wrapper {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            padding: 24px;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            transition: border-color 0.3s ease;
        }

        .game-wrapper:hover {
            border-color: var(--primary-color);
        }

        /* Container onde o emulador roda */
        .dosbox-container {
            width: 100%;
            height: 480px; /* Altura padrão para computadores */
            max-height: 70vh;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            border: 1px solid #333;
        }

        /* Responsividade para telas de celulares */
        @media (max-width: 768px) {
            .dosbox-container {
                height: 320px;
            }
            header h1 {
                font-size: 2.5rem;
            }
        }

        /* Painel de controles/instruções */
        .controls-panel {
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .controls-title {
            color: var(--title-color);
            font-size: 1.2rem;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .control-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 3px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-item span {
            font-size: 0.95rem;
        }

        .control-key {
            background: #2d2d30;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
            font-size: 0.85rem;
            border: 1px solid #444;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.85rem;
            color: #555;
            text-align: center;
        }

        footer a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>DOOM</h1>
        <p>Vivencie o clássico de 1993 diretamente do navegador</p>
    </header>

    <main class="game-wrapper">
        <!-- Container do Emulador -->
        <div id="dosbox" class="dosbox-container"></div>

        <!-- Instruções de Controles -->
        <section class="controls-panel">
            <h2 class="controls-title">Controles Clássicos</h2>
            <div class="controls-grid">
                <div class="control-item">
                    <span>Mover / Olhar</span>
                    <span class="control-key">Setas do Teclado</span>
                </div>
                <div class="control-item">
                    <span>Atirar</span>
                    <span class="control-key">Ctrl Esquerdo</span>
                </div>
                <div class="control-item">
                    <span>Abrir Portas / Usar</span>
                    <span class="control-key">Espaço</span>
                </div>
                <div class="control-item">
                    <span>Andar Lateral</span>
                    <span class="control-key">Alt (Segurar)</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Emulado via <a href="https://js-dos.com" target="_blank" rel="noopener">js-dos v8</a>. Hospedado localmente no Netlify.</p>
    </footer>

    <!-- JavaScript oficial do JS-DOS v8 -->
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
        // Inicializa o js-dos carregando o arquivo diretamente do mesmo diretório da sua página
        Dos(document.getElementById("dosbox"), {
            url: "./doom.jsdos"
        });
    </script>
</body>
</html>
